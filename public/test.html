<!DOCTYPE html>
<html>
<head>
  <title>Test Login</title>
</head>
<body>
  <h1>Test /auth/login</h1>
  <button id="loginBtn">Send Login Request</button>
  <pre id="output"></pre>

  <script>
    document.getElementById("loginBtn").addEventListener("click", async () => {
      const output = document.getElementById("output");

      try {
        const response = await fetch("/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ username: "kadin" })
        });

        const contentType = response.headers.get("content-type");

        if (contentType && contentType.includes("application/json")) {
          const data = await response.json();
          output.textContent = JSON.stringify(data, null, 2);
        } else {
          const text = await response.text();
          output.textContent = `Error: Response is not JSON\n\n${text}`;
        }

      } catch (err) {
        output.textContent = `Request failed:\n${err.message}`;
      }
    });
  </script>
</body>
</html>
