<!DOCTYPE html>
<html>
<body>

<h1>Test POST /api/contacts</h1>

<button id="btn">Create Contact</button>
<pre id="output"></pre>

<script>
const TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VybmFtZSI6ImthZGluIiwiaWF0IjoxNzY0OTgwMTQ2LCJleHAiOjE3NjQ5ODM3NDZ9.dbJTLGuxGkGnjWQGDlFW9yMMLCZEZAqxpOCcOZ_1ePg";

document.getElementById("btn").onclick = async () => {

  const res = await fetch("http://localhost:3000/api/contacts", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + TOKEN
    },
    body: JSON.stringify({
      firstname: "Test",
      lastname: "Contact",
      email: "testcontact@example.com"
    })
  });

  const data = await res.json();
  document.getElementById("output").textContent = JSON.stringify(data, null, 2);
};
</script>

</body>
</html>
